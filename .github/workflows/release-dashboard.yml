name: Release dashboard

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: frontend
        run: |
          npm ci --onnxruntime-node-install-cuda=skip
          npm run build
      - name: Package
        run: tar -czf dashboard.tar.gz -C frontend/dist .
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dashboard.tar.gz --clobber
