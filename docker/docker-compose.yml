services:
  openacm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: openacm
    ports:
      - "8080:8080"   # accesible desde cualquier equipo en tu LAN vía IP de la NAS
    volumes:
      - ../data:/app/data
      - ../config:/app/config
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
